services:
  postgres:
    image: postgres:16-alpine
    container_name: ilaila_local_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "00000000"
      POSTGRES_DB: ilaila_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ilaila_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: